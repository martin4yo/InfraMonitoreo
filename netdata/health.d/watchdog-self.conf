# Alarmas del auto-chequeo de hardening (charts statsd watchdog.self.*).
# Destino en el server: /etc/netdata/health.d/watchdog-self.conf
#
# Una alarma por control, para que el mensaje diga QUÉ se cayó sin tener que ir a
# mirar el chart. El `delay up` de 10m evita que un reboot legítimo dispare las
# cinco juntas mientras los servicios todavía están levantando.

 template: watchdog_ufw_caido
       on: watchdog.hardening_detalle
    class: Errors
     type: System
component: Watchdog
   lookup: min -10m unaligned of ufw
    every: 60s
     crit: $this < 1
    delay: up 10m down 30m
     info: ufw no esta activo en este server (firewall caido o desinstalado)
       to: sysadmin

 template: watchdog_ufw_no_enabled
       on: watchdog.hardening_detalle
    class: Errors
     type: System
component: Watchdog
   lookup: min -10m unaligned of ufw_enabled
    every: 60s
     crit: $this < 1
    delay: up 10m down 30m
     info: ufw esta activo pero la unit NO esta enabled: no vuelve tras un reboot (dev-1 quedo 20 dias sin firewall asi). Correr: systemctl enable ufw
       to: sysadmin

 template: watchdog_fail2ban_caido
       on: watchdog.hardening_detalle
    class: Errors
     type: System
component: Watchdog
   lookup: min -10m unaligned of fail2ban
    every: 60s
     warn: $this < 1
    delay: up 10m down 30m
     info: fail2ban no esta activo o el jail sshd no esta levantado (sin rate-limiting de SSH)
       to: sysadmin

 template: watchdog_sshd_password_habilitada
       on: watchdog.hardening_detalle
    class: Errors
     type: System
component: Watchdog
   lookup: min -10m unaligned of sshd_nopassword
    every: 60s
     crit: $this < 1
    delay: up 10m down 30m
     info: sshd acepta autenticacion por PASSWORD (se perdio la homologacion, brute-force posible)
       to: sysadmin

 template: watchdog_sshd_root_habilitado
       on: watchdog.hardening_detalle
    class: Errors
     type: System
component: Watchdog
   lookup: min -10m unaligned of sshd_noroot
    every: 60s
     crit: $this < 1
    delay: up 10m down 30m
     info: sshd permite login de ROOT (se perdio la homologacion)
       to: sysadmin

 template: watchdog_netdata_sin_claim
       on: watchdog.hardening_detalle
    class: Errors
     type: System
component: Watchdog
   lookup: min -10m unaligned of netdata_claimed
    every: 60s
     warn: $this < 1
    delay: up 10m down 30m
     info: el agente Netdata no esta claimed u online contra Cloud (el nodo dejaria de reportar)
       to: sysadmin

 template: watchdog_reboot_pendiente
       on: watchdog.mantenimiento
    class: Latency
     type: System
component: Watchdog
   lookup: min -30m unaligned of reboot_pending
    every: 5m
     warn: $this > 0
    delay: up 24h down 5m
     info: hay un reboot pendiente hace >24h (kernel/libc actualizados y sin activar). Programar la ventana de reinicio (C11 de G6)
       to: sysadmin

# El colector de pgBackRest de este server dejó de correr. Es la alarma que tapa el
# punto ciego confirmado el 2026-09-05: con `gaps when not collected = no`, un
# colector muerto congela pgbackrest.* en su último valor bueno y TODAS las alarmas
# de backup se quedan en CLEAR para siempre. Este control se mide desde otro cron.
#
# lookup -30m: el umbral del selfcheck ya es holgado (3-4 ciclos del colector), así
# que si además se sostiene 30 min, el colector está muerto y no llegando tarde.
 template: watchdog_colector_backup_muerto
       on: watchdog.monitoreo
    class: Errors
     type: System
component: Watchdog
   lookup: min -30m unaligned of colectores_backup
    every: 5m
     crit: $this < 1
    delay: up 10m down 30m
     info: un colector de pgBackRest declarado en este server no completa una corrida hace rato. OJO: mientras esto pase, las alarmas de backup NO son confiables — quedan congeladas en el ultimo valor y no avisan de nada
       to: sysadmin

# Cadencia del restore drill. El drill es la única prueba de que los backups son
# RESTAURABLES; sin esta alarma la cadencia depende de que alguien se acuerde, y así
# es como se pasaron 48 días entre el 2026-07-19 y el 2026-09-05.
 template: watchdog_drill_atrasado
       on: watchdog.drill
    class: Errors
     type: System
component: Watchdog
   lookup: min -1h unaligned of drill_fresco
    every: 10m
     warn: $this < 1
    delay: up 1h down 24h
     info: el restore drill no corre hace mas de 40 dias (cadencia mensual, C1 de G6). Ningun backup esta probado desde entonces. Correr scripts/70-restore-drill.sh en el host ejecutor
       to: sysadmin

# Resultado del último drill. Separada de la de cadencia a propósito: "no se corre"
# se arregla corriendolo; "corrio y fallo" es que el backup NO se pudo restaurar.
 template: watchdog_drill_fallido
       on: watchdog.drill
    class: Errors
     type: System
component: Watchdog
   lookup: min -1h unaligned of drill_paso
    every: 10m
     crit: $this < 1
    delay: up 30m down 24h
     info: el ultimo restore drill FALLO: alguna stanza no se pudo restaurar desde R2, o el WAL replay no llego al presente. El backup existe pero NO esta probado. Ver drill-history.csv y /tmp/restore-drill-logs/
       to: sysadmin

# Backup de adjuntos a R2 (restic). Son datos de salud que pgBackRest NO cubre: si este
# backup deja de correr, lo único que queda es el rsync diario a dev-1. Crit porque el
# RPO de los adjuntos pasa de 15 min a 24 h sin que nadie se entere.
 template: watchdog_adjuntos_atrasado
       on: watchdog.adjuntos
    class: Errors
     type: System
component: Watchdog
   lookup: min -15m unaligned of adjuntos_fresco
    every: 5m
     crit: $this < 1
    delay: up 15m down 1h
     info: el backup de adjuntos a R2 (restic) no termina OK hace mas de 1 hora. Los adjuntos subidos desde entonces solo estan en el server. Ver journalctl -t adjuntos-backup-<app> y /var/lib/adjuntos-backup/
       to: sysadmin

# Integridad del repositorio restic (check semanal del 5 % de los datos + forget/prune).
 template: watchdog_adjuntos_integridad
       on: watchdog.adjuntos
    class: Errors
     type: System
component: Watchdog
   lookup: min -1h unaligned of adjuntos_integro
    every: 10m
     crit: $this < 1
    delay: up 30m down 24h
     info: el mantenimiento semanal del backup de adjuntos FALLO o no corre hace mas de 8 dias. Puede haber datos corruptos en el repositorio de R2. Correr 'restic check' a mano y ver journalctl -t adjuntos-backup-<app>
       to: sysadmin
