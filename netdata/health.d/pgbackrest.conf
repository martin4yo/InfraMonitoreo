# ---------------------------------------------------------------------------
# INTEGRIDAD DEL REPO (`pgbackrest verify`, ver netdata/pgbackrest/pgbackrest-verify.sh)
#
# Estas dos alarmas responden lo que NINGUNA de las de arriba responde: los archivos
# que hay en el repo, ¿siguen siendo legibles? La frescura del backup y la llegada
# del WAL pueden estar impecables sobre un repo con un backup corrupto adentro.
#
# La EDAD la recalcula el colector cada 15 min, así que crece sola: esta alarma
# también es la que detecta que el cron semanal del verify dejó de correr.
# ---------------------------------------------------------------------------

 template: pgbackrest_verify_atrasado
       on: pgbackrest.verify_age
    class: Errors
     type: Database
component: pgBackRest
   lookup: max -2m unaligned of age
    units: seconds
    every: 5m
     warn: $this > 864000
     crit: $this > 1814400
    # up 24h: en un despliegue nuevo todas las stanzas arrancan "nunca verificadas" y
    # construir la línea de base lleva horas (verify lee los 48 GB del repo, y repo2
    # va por red). Frente a umbrales de 10 y 21 días, un día de gracia en el AVISO no
    # debilita nada — y evita que la primera corrida despierte a alguien de madrugada.
    delay: up 24h down 2h
     info: hace demasiado que no se verifica la integridad del repo (>10d warn / >21d crit; la cadencia es semanal por stanza). O el cron de pgbackrest-verify.sh dejo de correr, o una stanza nunca se verifico. Ver que stanza en el chart pgbackrest.verify_age_stanza
       to: sysadmin

 template: pgbackrest_verify_fallo
       on: pgbackrest.verify_status
    class: Errors
     type: Database
component: pgBackRest
   lookup: min -2m unaligned of verify_ok
    every: 5m
     crit: $this < 1
    delay: down 2h
     info: un `pgbackrest verify` FALLO: hay checksums que no validan en el repo (corrupcion silenciosa en repo1 o en R2). El backup existe pero puede no ser restaurable. Ver el detalle en /var/lib/pgbackrest-netdata/verify/ y el log en /var/log/pgbackrest/
       to: sysadmin
