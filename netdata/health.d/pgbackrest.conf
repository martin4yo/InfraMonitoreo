# Alarmas de pgBackRest (sobre los charts statsd pgbackrest.*).
# Destino en el server: /etc/netdata/health.d/pgbackrest.conf

 template: pgbackrest_backup_age
       on: pgbackrest.backup_age
    class: Errors
     type: Database
component: pgBackRest
   lookup: max -2m unaligned of age
    units: seconds
    every: 60s
     warn: $this > 90000
     crit: $this > 172800
    delay: down 30m
     info: el último backup OK de pgBackRest es demasiado viejo (>25h warn / >48h crit)
       to: sysadmin

 template: pgbackrest_backup_failed
       on: pgbackrest.status
    class: Errors
     type: Database
component: pgBackRest
   lookup: min -2m unaligned of backup_ok
    every: 60s
     crit: $this < 1
    delay: down 15m
     info: estado de backup pgBackRest no OK (alguna stanza con error o sin backups)
       to: sysadmin

# Edad del último WAL llegado al repo, UNA alarma por stanza. La dimensión es el
# nombre de stanza en pgbackrest.wal_age_stanza; se mide repo-side (mtime) para detectar
# cortes de archiving sin tocar cada DB. NOTA: en netdata 2.10 `foreach` no expande a
# instancias por dimensión, así que se definen explícitas (igual que el statsd). Prod
# va ajustado (15m/1h); dev-1 es de baja actividad → umbral laxo (6h/24h) anti-falsos.

 template: pgbackrest_wal_delayed_AxiomaCloudProd
       on: pgbackrest.wal_age_stanza
    class: Errors
     type: Database
component: pgBackRest
   lookup: max -2m unaligned of AxiomaCloudProd
    units: seconds
    every: 60s
     warn: $this > 900
     crit: $this > 3600
    delay: down 15m
     info: WAL de AxiomaCloudProd atrasado en el repo (>15m warn / >1h crit)
       to: sysadmin

