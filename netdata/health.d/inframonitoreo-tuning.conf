# Overrides de alarmas STOCK de Netdata para bajar ruido de notificaciones.
# Destino en el server: /etc/netdata/health.d/inframonitoreo-tuning.conf
#
# IMPORTANTE: este archivo NO tiene el mismo nombre que los stock (web_log.conf /
# httpcheck.conf) a propósito. Netdata, si ve un archivo con el MISMO nombre que el
# stock en /etc, ignora el stock ENTERO (perderíamos el resto de las alarmas de ese
# archivo). Con otro nombre + el mismo nombre de template, Netdata redefine SOLO ese
# template y conserva las demás alarmas stock.
#
# Cada bloque es copia del stock (netdata v2.10, /usr/lib/netdata/conf.d/health.d/)
# con los umbrales ajustados. Comentario "# INFRA:" marca lo que cambió vs stock.

# --- httpcheck: timeouts ---------------------------------------------------------
# Stock dispara warn con >=10% de timeouts en 5 min = ~3 muestras de ~30 => muy
# sensible, un hipo de red puntual lo prende y limpia solo en ~4-5 min.
# INFRA: warn 10->30, crit 40->60 (exige un endpoint genuinamente flaky, no un blip).
 template: httpcheck_web_service_timeouts
       on: httpcheck.status
    class: Latency
     type: Web Server
component: HTTP endpoint
   lookup: average -5m unaligned percentage of timeout
    every: 10s
    units: %
     warn: $this >= 30 AND $this < 60
     crit: $this >= 60
    delay: down 5m multiplier 1.5 max 1h
  summary: HTTP check for ${label:url} timeouts
     info: Percentage of timed-out HTTP requests to ${label:url} in the last 5 minutes
       to: webmaster

# --- web_log: lineas no parseadas ------------------------------------------------
# Stock dispara warn con >1% de lineas no parseables (si hay >120 req/min). Un burst
# de bots con requests HTTP malformados cruza eso y limpia solo en ~1 min => ruido.
# Se mantiene como red de seguridad para "rompimos el log_format" (parser al ~100%
# sostenido), que SI es accionable.
# INFRA: warn 1%->40%, delay up 1m->5m (debe persistir 5 min para notificar).
 template: web_log_1m_unmatched
       on: web_log.excluded_requests
    class: Errors
     type: Web Server
component: Web log
   lookup: sum -1m unaligned of unmatched
     calc: $this * 100 / $web_log_1m_total_requests
    units: %
    every: 10s
     warn: ($web_log_1m_total_requests > 120) ? ($this > 40) : ( 0 )
    delay: up 5m down 10m multiplier 1.5 max 1h
  summary: Web log unparsed
     info: Percentage of unparsed log lines over the last minute
       to: webmaster
