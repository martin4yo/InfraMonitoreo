# Alarmas del archive-push del lado DB HOST (charts pgbackrest.archive_*).
# Destino en el server: /etc/netdata/health.d/pgbackrest-archive.conf
#
# Corren en el Netdata del propio db host → avisan aunque el repo host (dev-1)
# esté caído, que es justo cuando archive-push empieza a fallar.
#
# Los umbrales piden que la condición se SOSTENGA ~10 min: el reboot de dev-1
# corta archive-push ~90 s y se recupera solo (el falso "repo1 roto" del
# 2026-09-03). `lookup: min -10m` exige que TODA la ventana esté en falla, así
# un blip no dispara y una rotura real sí.

 template: pgbackrest_archive_push_failing
       on: pgbackrest.archive_failing
    class: Errors
     type: System
component: pgBackRest
   lookup: min -10m unaligned of failing
    every: 60s
     crit: $this > 0
    delay: up 5m down 15m
     info: archive-push de este db host lleva >10m fallando sin recuperarse (el repo host o la confianza SSH no responden) — los WAL nuevos NO estan llegando al backup
       to: sysadmin

 template: pgbackrest_archive_backlog
       on: pgbackrest.archive_backlog
    class: Errors
     type: System
component: pgBackRest
   lookup: min -10m unaligned of ready_backlog
    every: 60s
     warn: $this > 10
     crit: $this > 50
    delay: up 5m down 15m
     info: WAL sin archivar acumulandose en este db host (cola .ready): archive-push no drena. Riesgo de perder ventana de recuperacion y, si el disco se llena, de frenar PostgreSQL
       to: sysadmin

 template: pgbackrest_archive_sin_exito
       on: pgbackrest.archive_since_ok
    class: Errors
     type: System
component: pgBackRest
   lookup: min -30m unaligned of since_last_ok
    every: 5m
     warn: $this > 7200
    delay: up 10m down 30m
     info: hace >2h que este db host no logra archivar un WAL con exito (en una base activa es sospechoso; en una de baja actividad puede ser normal)
       to: sysadmin
