# Alarmas del watchdog de flota (charts statsd watchdog.*). Solo en dev-1.
# Destino en el server: /etc/netdata/health.d/watchdog-fleet.conf
#
# Estas son las alarmas que hubieran avisado de la reinstalación de axioma-drp del
# 2026-08-08, que pasó 3 días sin que nadie la detectara.

# ---------------------------------------------------------------------------
# LA alarma importante: una host key que cambia significa SISTEMA REINSTALADO
# (o, mucho menos probable pero más grave, un MITM). No hay caso benigno: si la
# reinstalación fue legítima, se re-siembra la línea de base a mano con
# `hostkey-watchdog.py --reseed <server>` y queda asentado en docs/hardening.md.
# Va directo a crítico, sin warning: no es una degradación, es un hecho.
# ---------------------------------------------------------------------------
 template: watchdog_hostkey_changed
       on: watchdog.hostkey_ok
    class: Errors
     type: System
component: Watchdog
   lookup: min -5m unaligned of hostkey_ok
    every: 60s
     crit: $this < 1
    # up 0: una host key que cambia no admite periodo de gracia, dispara ya.
    # down 15m: la condicion solo se limpia a mano (re-sembrando la linea de base),
    # asi que el delay es anti-flapping, no anti-ruido. 1h resultaba impractico al
    # validar la alarma o tras un reseed legitimo.
    delay: up 0 down 15m
     info: la host key SSH de algún server CAMBIO -> sistema reinstalado. Ver que server en el chart watchdog.hostkey_server y confirmar si la reinstalacion era esperada ANTES de re-sembrar la linea de base
       to: sysadmin

# ---------------------------------------------------------------------------
# Server ausente. Esto es lo mismo que la alarma "unreachable" de Netdata Cloud,
# pero calculado acá: no depende de que el agente del server caído reporte nada,
# ni de la reachability de Cloud (que el propio foro de Netdata describe como
# poco confiable). 15 min de gracia para no gritar en cada reboot.
# ---------------------------------------------------------------------------
 template: watchdog_server_ausente
       on: watchdog.reachable_count
    class: Errors
     type: System
component: Watchdog
   lookup: min -15m unaligned of reachable
    units: servers
    every: 60s
     warn: $this < 5
     crit: $this < 4
    delay: up 5m down 30m
     info: hay servers de la flota sin responder en SSH por mas de 15 min (esperados 5). Ver cual en el chart watchdog.reachable_server
       to: sysadmin
