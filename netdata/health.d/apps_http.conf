# Alarmas de disponibilidad de apps (sobre el colector httpcheck).
# Destino en el server: /etc/netdata/health.d/apps_http.conf
#
# Avisa apenas un endpoint deja de responder OK o se pone lento, para enterarte
# antes que el cliente. Aplica a todos los jobs del chart httpcheck.

template: app_http_unreachable
      on: httpcheck.status
   class: Errors
    type: Web Server
component: HTTP endpoint
  lookup: average -10s percentage of failed
   units: %
   every: 10s
    warn: $this > 0
    crit: $this >= 75
   delay: down 5m multiplier 1.5 max 1h
    info: la app no está respondiendo correctamente (status != 200 / sin respuesta)
      to: sysadmin

template: app_http_slow
      on: httpcheck.response_time
   class: Latency
    type: Web Server
component: HTTP endpoint
  lookup: average -1m unaligned of time
   units: ms
   every: 10s
    warn: $this > 1500
    crit: $this > 5000
   delay: down 5m multiplier 1.5 max 1h
    info: la app responde pero con latencia alta
      to: sysadmin
