# Charts del colector de archive-push (archive-push-collect.py), lado DB HOST.
# Destino en el server: /etc/netdata/statsd.d/pgbackrest-archive.conf
#
# Corre en cada db host (axioma/clubix/axiodemo/dev-1) y mira SU propio
# pg_stat_archiver + la cola de WAL sin archivar, independiente del repo host.
# Ver netdata/pgbackrest/archive-push-collect.py.

[app]
    name = pgbackrest_archive
    metrics = pgbackrest.archive.*
    private charts = no
    gaps when not collected = no
    memory mode = ram
    history = 120

[archive_backlog]
    name = archive_backlog
    title = pgBackRest - WAL sin archivar (cola .ready)
    family = pgbackrest
    context = pgbackrest.archive_backlog
    units = archivos
    type = line
    dimension = pgbackrest.archive.ready_backlog ready_backlog last 1 1

[archive_failing]
    name = archive_failing
    title = pgBackRest - archive-push fallando (1=si)
    family = pgbackrest
    context = pgbackrest.archive_failing
    units = boolean
    type = line
    dimension = pgbackrest.archive.failing failing last 1 1

[archive_since_ok]
    name = archive_since_ok
    title = pgBackRest - seg desde el ultimo WAL archivado OK
    family = pgbackrest
    context = pgbackrest.archive_since_ok
    units = segundos
    type = line
    dimension = pgbackrest.archive.since_last_ok since_last_ok last 1 1

[archive_failed_total]
    name = archive_failed_total
    title = pgBackRest - failed_count acumulado (tendencia)
    family = pgbackrest
    context = pgbackrest.archive_failed_total
    units = fallos
    type = line
    dimension = pgbackrest.archive.failed_total failed_total last 1 1
