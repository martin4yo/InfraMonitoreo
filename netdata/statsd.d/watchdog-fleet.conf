# Charts sintéticos para el watchdog de flota (hostkey-watchdog.py).
# Destino en el server: /etc/netdata/statsd.d/watchdog-fleet.conf  — solo en dev-1.
#
# OJO: igual que en pgbackrest.conf, statsd NO crea las dimensiones solo. Si se
# suma o se saca un server del inventario, hay que actualizar las dimensiones de
# abajo Y la línea de base /etc/watchdog/baseline.json.
# Servers actuales: axioma, clubix, axiodemo, dev-1, axioma-drp.

[app]
    name = watchdog_fleet
    metrics = watchdog.fleet.*
    private charts = no
    gaps when not collected = no
    memory mode = ram
    history = 60

# ----------------------------- agregados -----------------------------
[hostkey_ok]
    name = hostkey_ok
    title = Watchdog - host keys de la flota sin cambios (1=OK)
    family = watchdog
    context = watchdog.hostkey_ok
    units = boolean
    type = line
    dimension = watchdog.fleet.hostkey_ok hostkey_ok last 1 1

[reachable_count]
    name = reachable_count
    title = Watchdog - servers que responden en SSH
    family = watchdog
    context = watchdog.reachable_count
    units = servers
    type = line
    dimension = watchdog.fleet.reachable_count reachable last 1 1

# ----------------------------- por server -----------------------------
# 1 = la host key coincide con la línea de base. 0 = CAMBIÓ -> server reinstalado.
[hostkey_server]
    name = hostkey_server
    title = Watchdog - host key SSH por server (1=coincide, 0=CAMBIO)
    family = watchdog
    context = watchdog.hostkey_server
    units = boolean
    type = line
    dimension = watchdog.fleet.hostkey.axioma axioma last 1 1
    dimension = watchdog.fleet.hostkey.clubix clubix last 1 1
    dimension = watchdog.fleet.hostkey.axiodemo axiodemo last 1 1
    dimension = watchdog.fleet.hostkey.dev-1 dev-1 last 1 1
    dimension = watchdog.fleet.hostkey.axioma-drp axioma-drp last 1 1

[reachable_server]
    name = reachable_server
    title = Watchdog - SSH responde por server (1=si)
    family = watchdog
    context = watchdog.reachable_server
    units = boolean
    type = line
    dimension = watchdog.fleet.reachable.axioma axioma last 1 1
    dimension = watchdog.fleet.reachable.clubix clubix last 1 1
    dimension = watchdog.fleet.reachable.axiodemo axiodemo last 1 1
    dimension = watchdog.fleet.reachable.dev-1 dev-1 last 1 1
    dimension = watchdog.fleet.reachable.axioma-drp axioma-drp last 1 1
