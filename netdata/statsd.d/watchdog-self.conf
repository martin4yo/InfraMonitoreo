# Charts sintéticos para el auto-chequeo de hardening (hardening-selfcheck.sh).
# Destino en el server: /etc/netdata/statsd.d/watchdog-self.conf
#
# Desplegado en los 5 servers desde el 2026-09-03 (antes solo axioma-drp). Al sumar
# un server nuevo, confirmar primero que ufw/fail2ban/sshd están en el estado que
# estas métricas dan por bueno; si un control está caído de verdad, la alarma en
# rojo es el resultado correcto y hay que arreglar el control, no la alarma.

[app]
    name = watchdog_self
    metrics = watchdog.self.*
    private charts = no
    gaps when not collected = no
    memory mode = ram
    history = 60

[hardening_ok]
    name = hardening_ok
    title = Watchdog - hardening del server completo (1=OK)
    family = watchdog
    context = watchdog.hardening_ok
    units = boolean
    type = line
    dimension = watchdog.self.ok ok last 1 1

[hardening_detalle]
    name = hardening_detalle
    title = Watchdog - controles de hardening por control (1=OK)
    family = watchdog
    context = watchdog.hardening_detalle
    units = boolean
    type = line
    dimension = watchdog.self.ufw ufw last 1 1
    dimension = watchdog.self.ufw_enabled ufw_enabled last 1 1
    dimension = watchdog.self.fail2ban fail2ban last 1 1
    dimension = watchdog.self.sshd_nopassword sshd_nopassword last 1 1
    dimension = watchdog.self.sshd_noroot sshd_noroot last 1 1
    dimension = watchdog.self.netdata_claimed netdata_claimed last 1 1

[mantenimiento]
    name = mantenimiento
    title = Watchdog - reboot pendiente (1=si, kernel/libc sin activar)
    family = watchdog
    context = watchdog.mantenimiento
    units = boolean
    type = line
    dimension = watchdog.self.reboot_pending reboot_pending last 1 1
