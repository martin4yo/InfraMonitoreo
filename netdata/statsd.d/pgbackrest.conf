# Chart sintético de statsd para las métricas de pgBackRest.
# Destino en el server: /etc/netdata/statsd.d/pgbackrest.conf
#
# Toma los gauges que empuja pgbackrest-collect.py y los arma como charts
# alarmables (ids: pgbackrest.backup_age y pgbackrest.status).

[app]
    name = pgbackrest
    metrics = pgbackrest.*
    private charts = no
    gaps when not collected = no
    memory mode = ram
    history = 60

[backup_age]
    name = backup_age
    title = pgBackRest - edad del último backup OK
    family = pgbackrest
    context = pgbackrest.backup_age
    units = seconds
    type = line
    dimension = pgbackrest.backup_age age last 1 1

[status]
    name = status
    title = pgBackRest - estado (1=OK)
    family = pgbackrest
    context = pgbackrest.status
    units = boolean
    type = line
    dimension = pgbackrest.backup_ok backup_ok last 1 1
