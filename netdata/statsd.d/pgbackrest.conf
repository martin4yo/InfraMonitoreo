# Charts sintéticos de statsd para las métricas de pgBackRest.
# Destino en el server: /etc/netdata/statsd.d/pgbackrest.conf
#
# Toma los gauges que empuja pgbackrest-collect.py. Hay charts AGREGADOS (peor
# stanza / estado global, sobre los que disparan las alarmas históricas) y charts
# POR STANZA con una dimensión por cada una.
#
# OJO: las dimensiones por stanza están listadas explícitamente (statsd no las crea
# solas). Si se agrega/quita una stanza, actualizar las secciones *_stanza de abajo.
# Stanzas actuales: AxiomaCloudProd, clubix, axiodemo, dev-1.

[app]
    name = pgbackrest
    metrics = pgbackrest.*
    private charts = no
    gaps when not collected = no
    memory mode = ram
    history = 60

# ----------------------------- agregados -----------------------------
[backup_age]
    name = backup_age
    title = pgBackRest - edad del último backup OK (peor stanza)
    family = pgbackrest
    context = pgbackrest.backup_age
    units = seconds
    type = line
    dimension = pgbackrest.backup_age age last 1 1

[status]
    name = status
    title = pgBackRest - estado agregado (1=OK)
    family = pgbackrest
    context = pgbackrest.status
    units = boolean
    type = line
    dimension = pgbackrest.backup_ok backup_ok last 1 1

# ----------------------------- por stanza -----------------------------
[backup_age_stanza]
    name = backup_age_stanza
    title = pgBackRest - edad del backup por stanza
    family = pgbackrest
    context = pgbackrest.backup_age_stanza
    units = seconds
    type = line
    dimension = pgbackrest.AxiomaCloudProd.backup_age AxiomaCloudProd last 1 1
    dimension = pgbackrest.clubix.backup_age clubix last 1 1
    dimension = pgbackrest.axiodemo.backup_age axiodemo last 1 1
    dimension = pgbackrest.dev-1.backup_age dev-1 last 1 1

[wal_age_stanza]
    name = wal_age_stanza
    title = pgBackRest - edad del último WAL en el repo por stanza
    family = pgbackrest
    context = pgbackrest.wal_age_stanza
    units = seconds
    type = line
    dimension = pgbackrest.AxiomaCloudProd.wal_age AxiomaCloudProd last 1 1
    dimension = pgbackrest.clubix.wal_age clubix last 1 1
    dimension = pgbackrest.axiodemo.wal_age axiodemo last 1 1
    dimension = pgbackrest.dev-1.wal_age dev-1 last 1 1

[status_stanza]
    name = status_stanza
    title = pgBackRest - estado por stanza (1=OK)
    family = pgbackrest
    context = pgbackrest.status_stanza
    units = boolean
    type = line
    dimension = pgbackrest.AxiomaCloudProd.backup_ok AxiomaCloudProd last 1 1
    dimension = pgbackrest.clubix.backup_ok clubix last 1 1
    dimension = pgbackrest.axiodemo.backup_ok axiodemo last 1 1
    dimension = pgbackrest.dev-1.backup_ok dev-1 last 1 1
