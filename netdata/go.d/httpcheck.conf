# Chequeo de disponibilidad HTTP de las apps (go.d/httpcheck).
# Destino en el server: /etc/netdata/go.d/httpcheck.conf
#
# Este archivo se GENERA automáticamente por 20-deploy-configs.sh a partir del
# campo endpoint_health del inventario, así que no suele editarse a mano.
# Lo que sigue es solo un ejemplo de referencia del formato esperado:
#
# jobs:
#   - name: app_prod-1
#     url: https://app1.midominio.com/health
#     status_accepted: [200]
#     timeout: 5
#     update_every: 10
#
# Dispara alarma si el endpoint deja de responder 200, si tarda demasiado, o si
# el certificado TLS está por expirar. Es la capa que avisa "la app no responde"
# antes de que lo note el cliente.
jobs: []
