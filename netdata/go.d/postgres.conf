# Colector PostgreSQL para Netdata (go.d).
# Destino en el server: /etc/netdata/go.d/postgres.conf
#
# Requiere un usuario read-only. Crealo una vez (ver docs/setup-netdata-cloud.md):
#   CREATE USER netdata PASSWORD 'CAMBIAR_ESTA_CLAVE';
#   GRANT pg_monitor TO netdata;
#
# Reemplazá CAMBIAR_ESTA_CLAVE por la clave real (o usá auth por socket/peer).
jobs:
  - name: local
    # Auth por socket Unix + peer (rol read-only 'netdata', sin clave en el repo).
    # En clubix y dev-1 se agregó 'local all netdata peer' al pg_hba para habilitarlo.
    dsn: 'host=/var/run/postgresql dbname=postgres user=netdata'
    collect_databases_matching: '*'
    timeout: 2
