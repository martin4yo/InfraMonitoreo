# Colector nginx para Netdata (go.d).
# Destino en el server: /etc/netdata/go.d/nginx.conf
#
# Requiere el módulo stub_status habilitado en nginx. Agregá este location en
# tu config de nginx (ver docs/setup-netdata-cloud.md) y recargá:
#
#   server {
#       listen 127.0.0.1:80;
#       location /stub_status {
#           stub_status;
#           allow 127.0.0.1;
#           deny all;
#       }
#   }
jobs:
  - name: local
    url: http://127.0.0.1:8088/stub_status
    timeout: 2
