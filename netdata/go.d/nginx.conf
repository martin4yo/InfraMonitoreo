# Colector nginx para Netdata (go.d).
# Destino en el server: /etc/netdata/go.d/nginx.conf
#
# Requiere el módulo stub_status habilitado en nginx en un server dedicado a
# 127.0.0.1:8088 (ver docs/setup-netdata-cloud.md). En los 3 servers ya vive en
# /etc/nginx/conf.d/netdata_stub_status.conf. El colector apunta a :8088 (abajo),
# no al :80 público. Snippet de referencia:
#
#   server {
#       listen 127.0.0.1:8088;
#       server_name _;
#       location = /stub_status {
#           stub_status;
#           allow 127.0.0.1;
#           deny all;
#       }
#   }
jobs:
  - name: local
    url: http://127.0.0.1:8088/stub_status
    timeout: 2
