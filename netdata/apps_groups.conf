# Agrupación de procesos para apps.plugin de Netdata.
# Destino en el server: /etc/netdata/apps_groups.conf
#
# Netdata ya trae un apps_groups.conf por defecto; este lo COMPLEMENTA para que
# Node/pm2/Python/PostgreSQL/nginx aparezcan como grupos claros en los gráficos
# de "Applications" (CPU, RAM, FDs, etc. por aplicación).
#
# Formato:  nombre_grupo: patron1 patron2 ...
# (los patrones matchean por nombre de proceso / comando)

pm2: PM2* pm2*
node: node nodejs npm next next-server vite
python: python python3 gunicorn uvicorn celery
postgres: postgres postmaster
nginx: nginx
