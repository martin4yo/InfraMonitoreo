server {
    if ($host = axiomaweb.axiomacloud.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name axiomaweb.axiomacloud.com;
    return 301 https://$host$request_uri;


}

server {
    listen 443 ssl http2;
    server_name axiomaweb.axiomacloud.com;
    ssl_certificate /etc/letsencrypt/live/axiomaweb.axiomacloud.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/axiomaweb.axiomacloud.com/privkey.pem; # managed by Certbot

    root /var/www/AxiomaWeb/frontend/dist;
    index index.html;

    # Para permitir SPA (Single Page Application)
    location / {
        try_files $uri /index.html;
    }

    # Backend
    location /api/ {
        proxy_pass http://127.0.0.1:3150;   # tu backend en PM2
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

}
