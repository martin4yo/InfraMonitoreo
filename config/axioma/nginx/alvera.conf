# =============================================
# ALVERA - Configuración Nginx
# Sistema de Gestión Médica Multi-tenant
# =============================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=alvera_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=alvera_login:10m rate=5r/m;

# ---------------------------------------------
# HTTP -> HTTPS Redirect
# ---------------------------------------------
server {
    include snippets/block-scanners.conf;
    listen 80;
    listen [::]:80;
    server_name alvera.axiomacloud.com;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect todo a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

}

# ---------------------------------------------
# Backend API - api.alvera.axiomacloud.com
# ---------------------------------------------
server {
    include snippets/block-scanners.conf;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.alvera.axiomacloud.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/alvera.axiomacloud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alvera.axiomacloud.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # SSL Protocols (Modern configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/alvera.axiomacloud.com/chain.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tamaño máximo de upload (historias clínicas, documentos)
    client_max_body_size 50M;

    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Rate limiting para login (protección contra brute force)
    location ~* ^/api/(auth/login|users/login) {
        limit_req zone=alvera_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # WebSocket para notificaciones en tiempo real
    location /socket.io {
        proxy_pass http://127.0.0.1:5300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # API general
    location / {
        limit_req zone=alvera_api burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Ocultar archivos dot
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logs
    access_log /var/log/nginx/alvera-api-access.log;
    error_log /var/log/nginx/alvera-api-error.log warn;
}

# ---------------------------------------------
# Frontend - alvera.axiomacloud.com
# ---------------------------------------------
server {
    include snippets/block-scanners.conf;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alvera.axiomacloud.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/alvera.axiomacloud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alvera.axiomacloud.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # SSL Protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/alvera.axiomacloud.com/chain.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root del frontend (build de Vite)
    root /var/www/mediflow/frontend/dist;
    index index.html;

    # Comprimir respuestas
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Cache para assets estáticos (JS, CSS, fuentes, imágenes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA: todas las rutas sirven index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ocultar archivos dot
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logs
    access_log /var/log/nginx/alvera-frontend-access.log;
    error_log /var/log/nginx/alvera-frontend-error.log warn;

# Proxy API al backend
      location /api/ {
          limit_req zone=alvera_api burst=50 nodelay;
          limit_req_status 429;

          proxy_pass http://127.0.0.1:5300;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Port $server_port;
          proxy_connect_timeout 60s;
          proxy_send_timeout 120s;
          proxy_read_timeout 120s;
      }

      # WebSocket
      location /socket.io/ {
          proxy_pass http://127.0.0.1:5300;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_connect_timeout 7d;
          proxy_send_timeout 7d;
          proxy_read_timeout 7d;
      }

}
