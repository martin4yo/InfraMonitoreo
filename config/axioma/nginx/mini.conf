# ==========================================
# NGINX Configuration - AxiomaWeb Mini
# Dominio: mini.axiomacloud.com
# PASO 1: Configuración inicial SIN SSL
# ==========================================

server {
    include snippets/block-scanners.conf;
    server_name mini.axiomacloud.com;

    # Root directory para el frontend
    root /var/www/mini/frontend/dist;
    index index.html;

    # Logs
    access_log /var/log/nginx/mini_access.log;
    error_log /var/log/nginx/mini_error.log warn;

    # Proxy para el API Backend
    location /api {
        proxy_pass http://localhost:8095;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

     # Timeouts: subir a 120s para soportar generación de PDFs grandes
        proxy_connect_timeout 120s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        client_max_body_size 50M;

    }

    # Proxy para archivos de uploads
      location /uploads/ {
          proxy_pass http://localhost:8095;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          add_header Access-Control-Allow-Origin *;
          add_header Access-Control-Allow-Methods 'GET, OPTIONS';
          add_header Cache-Control 'public, max-age=31536000';
      }

    # Servir archivos estáticos del frontend (React SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Denegar acceso a archivos ocultos
    location ~ /\. {
        deny all;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mini.axiomacloud.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mini.axiomacloud.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    include snippets/block-scanners.conf;
    if ($host = mini.axiomacloud.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name mini.axiomacloud.com;
    return 404; # managed by Certbot


}
