# ==========================================
# NGINX - Micrositio Axioma Mini
# Dominios: axioma.ar (canonico) + www.axioma.ar (redirige a apex)
# Sirve la carpeta web/ del repo desplegado en /var/www/mini
# ==========================================
server {
    listen 80;
    listen [::]:80;
    server_name axioma.ar www.axioma.ar;

    location /.well-known/acme-challenge/ {
        root /var/www/mini/web;
        allow all;
    }
    location / {
        return 301 https://axioma.ar$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name axioma.ar www.axioma.ar;

    root /var/www/mini/web;
    index index.html;

    access_log /var/log/nginx/axioma.ar_access.log;
    error_log  /var/log/nginx/axioma.ar_error.log warn;

    ssl_certificate /etc/letsencrypt/live/axioma.ar/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/axioma.ar/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Canonico: www -> apex
    if ($host = www.axioma.ar) {
        return 301 https://axioma.ar$request_uri;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
}
