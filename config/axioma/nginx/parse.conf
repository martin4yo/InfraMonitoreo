# ── Rate limiting (definir UNA sola vez por servidor) ──
  limit_req_zone $binary_remote_addr zone=parse_api:10m   rate=50r/s;
  limit_req_zone $binary_remote_addr zone=parse_login:10m rate=5r/m;

  # ── Redirect HTTP → HTTPS (ambos dominios) ──
  server {
    include snippets/block-scanners.conf;
      listen 80;
      listen [::]:80;
      server_name parse.axiomacloud.com api.parse.axiomacloud.com;
      return 301 https://$host$request_uri;
  }

  # ── Frontend (Next.js) ──
  server {
    include snippets/block-scanners.conf;
      listen 443 ssl http2;
      listen [::]:443 ssl http2;
      server_name parse.axiomacloud.com;

      ssl_certificate     /etc/letsencrypt/live/parse.axiomacloud.com/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/parse.axiomacloud.com/privkey.pem;
      include /etc/letsencrypt/options-ssl-nginx.conf;
      ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

      # Security headers
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Frame-Options          "SAMEORIGIN" always;
      add_header X-Content-Type-Options   "nosniff" always;
      add_header X-XSS-Protection         "1; mode=block" always;
      add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

      client_max_body_size 25M;     # uploads de documentos PDF/imagen

      # Compresión
      gzip on;
      gzip_comp_level 6;
      gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
      gzip_vary on;

      access_log /var/log/nginx/parse-frontend.access.log combined buffer=32k;
      error_log  /var/log/nginx/parse-frontend.error.log warn;

      location / {
          proxy_pass http://127.0.0.1:8087;
          proxy_http_version 1.1;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Upgrade           $http_upgrade;
          proxy_set_header Connection        "upgrade";
          proxy_read_timeout 300s;
          proxy_connect_timeout 300s;
          proxy_send_timeout 300s;
      }

      # Assets estáticos de Next con hash → cache largo
      location ~* /_next/static/ {
          proxy_pass http://127.0.0.1:8087;
          proxy_cache_valid 200 1y;
          add_header Cache-Control "public, immutable";
      }
  }

 # ── Backend API (HTTPS) ──
  server {
    include snippets/block-scanners.conf;
      listen 443 ssl http2;
      listen [::]:443 ssl http2;
      server_name api.parse.axiomacloud.com;

      ssl_certificate     /etc/letsencrypt/live/parse.axiomacloud.com/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/parse.axiomacloud.com/privkey.pem;
      include /etc/letsencrypt/options-ssl-nginx.conf;
      ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy        "no-referrer" always;

      client_max_body_size 25M;

      # Catálogo de releases de ax-sync-client / sync-client-folder — los .exe subidos
      # acá superan el client_max_body_size general (25M), necesitan su propio límite
      # y más timeout (uploads/downloads grandes).
      location /api/sync/releases {
          limit_req zone=parse_api burst=100 nodelay;
          limit_req_status 429;
          client_max_body_size 200M;

          proxy_pass http://127.0.0.1:5100;
          proxy_http_version 1.1;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Upgrade           $http_upgrade;
          proxy_set_header Connection        "upgrade";
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
      }

      # Dataset del asistente de reglas IA (export histórico ERP): CSV/Excel,
      # a veces gzipeados, de varios cientos de MB — supera el client_max_body_size
      # general (25M), necesita su propio límite y más timeout.
      location /api/asistente-reglas/dataset {
          limit_req zone=parse_api burst=100 nodelay;
          limit_req_status 429;
          client_max_body_size 300M;

          proxy_pass http://127.0.0.1:5100;
          proxy_http_version 1.1;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Upgrade           $http_upgrade;
          proxy_set_header Connection        "upgrade";
          proxy_read_timeout 300s;
          proxy_send_timeout 300s;
      }

      location / {
          proxy_pass http://127.0.0.1:5100;
          proxy_http_version 1.1;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Upgrade           $http_upgrade;
          proxy_set_header Connection        "upgrade";
          proxy_read_timeout 120s;
      }
  }

 # ── Redirect HTTP → HTTPS para api ──
  server {
    include snippets/block-scanners.conf;
      listen 80;
      listen [::]:80;
      server_name api.parse.axiomacloud.com;
      return 301 https://$host$request_uri;
  }
