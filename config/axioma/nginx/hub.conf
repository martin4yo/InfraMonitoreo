# ── hub — frontend (hub.axiomacloud.com :8089) + backend API (api.hub.axiomacloud.com :5200) ──

# ── Redirect HTTP → HTTPS (ambos dominios) + acme-challenge ──
server {
    include snippets/block-scanners.conf;
    listen 80;
    listen [::]:80;
    server_name hub.axiomacloud.com api.hub.axiomacloud.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Frontend (Next.js) — hub.axiomacloud.com ──
server {
    include snippets/block-scanners.conf;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hub.axiomacloud.com;

    ssl_certificate     /etc/letsencrypt/live/hub.axiomacloud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.axiomacloud.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 25M;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    access_log /var/log/nginx/hub-frontend.access.log combined buffer=32k;
    error_log  /var/log/nginx/hub-frontend.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~* /_next/static/ {
        proxy_pass http://127.0.0.1:8089;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── Backend API (HTTPS) — api.hub.axiomacloud.com ──
server {
    include snippets/block-scanners.conf;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.hub.axiomacloud.com;

    ssl_certificate     /etc/letsencrypt/live/hub.axiomacloud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.axiomacloud.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;

    client_max_body_size 25M;

    access_log /var/log/nginx/hub-backend.access.log combined buffer=32k;
    error_log  /var/log/nginx/hub-backend.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:5200;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
