 # =============================================
  # ELORE - elore.com.ar (+ www)
  # =============================================

  limit_req_zone $binary_remote_addr zone=elore_general:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=elore_login:10m rate=5r/m;

  # ---------------------------------------------
  # HTTP -> HTTPS (apex y www)
  # ---------------------------------------------
  server {
    include snippets/block-scanners.conf;
      listen 80;
      listen [::]:80;
      server_name elore.com.ar www.elore.com.ar *.elore.com.ar;

      # Webroot para renovaciones de certbot
      location /.well-known/acme-challenge/ {
          root /var/www/certbot;
      }

      location / {
          return 301 https://elore.com.ar$request_uri;
      }
  }

  # ---------------------------------------------
  # www.elore.com.ar -> elore.com.ar (apex)
  # ---------------------------------------------
  server {
    include snippets/block-scanners.conf;
      listen 443 ssl http2;
      listen [::]:443 ssl http2;
      server_name www.elore.com.ar;

      ssl_certificate /etc/letsencrypt/live/elore.com.ar/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/elore.com.ar/privkey.pem;

      return 301 https://elore.com.ar$request_uri;
  }

  # ---------------------------------------------
  # ELORE - elore.com.ar (principal)
  # ---------------------------------------------
  server {
    include snippets/block-scanners.conf;
      listen 443 ssl http2;
      listen [::]:443 ssl http2;
      server_name elore.com.ar *.elore.com.ar;

      # SSL
      ssl_certificate /etc/letsencrypt/live/elore.com.ar/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/elore.com.ar/privkey.pem;
      ssl_session_timeout 1d;
      ssl_session_cache shared:SSL:50m;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
      ssl_prefer_server_ciphers off;

      # Headers de seguridad
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Strict-Transport-Security "max-age=63072000" always;

      client_max_body_size 20M;

      # Rate limiting para login
      location /api/auth/login {
          limit_req zone=elore_login burst=3 nodelay;
          limit_req_status 429;

          proxy_pass http://127.0.0.1:3700;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection 'upgrade';
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_cache_bypass $http_upgrade;
      }

      # Cache para assets estáticos de Next.js
      location /_next/static {
          proxy_pass http://127.0.0.1:3700;
          proxy_cache_valid 200 365d;
          add_header Cache-Control "public, max-age=31536000, immutable";
          proxy_http_version 1.1;
          proxy_set_header Host $host;
      }

      # Cache para imágenes y assets públicos
      location /images {
          proxy_pass http://127.0.0.1:3700;
          proxy_cache_valid 200 7d;
          add_header Cache-Control "public, max-age=604800";
          proxy_http_version 1.1;
          proxy_set_header Host $host;
      }

      # API Routes (rate limiting general)
      location /api/ {
          limit_req zone=elore_general burst=20 nodelay;

          proxy_pass http://127.0.0.1:3700;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_connect_timeout 60s;
          proxy_send_timeout 120s;
          proxy_read_timeout 120s;
      }

      # Aplicación principal (Next.js)
      location / {
          proxy_pass http://127.0.0.1:3700;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection 'upgrade';
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_cache_bypass $http_upgrade;

          proxy_connect_timeout 60s;
          proxy_send_timeout 60s;
          proxy_read_timeout 60s;
      }

      # Denegar archivos ocultos
      location ~ /\. {
          deny all;
      }
  }
